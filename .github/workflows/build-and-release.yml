name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag version
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Run build-all.sh
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh --build ${{ steps.get_version.outputs.version }}

      - name: Create GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists."
          else
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "keycloak-extensions ${{ github.ref_name }}" \
              --notes "Release for keycloak extensions"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            scripts/builds-${{ steps.get_version.outputs.version }}/*.jar
            scripts/builds-${{ steps.get_version.outputs.version }}/SHA256SUMS
