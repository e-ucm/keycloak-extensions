name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag version
        id: get_version
        run: echo "version=${GITHUB_TAG#v}" >> $GITHUB_OUTPUT

      - name: Compare config.xml version with tag
        id: compare_version
        run: |
          CONFIG_VERSION=$(grep -m1 '<version>' config.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "version_mismatch=true" >> $GITHUB_OUTPUT
          else
            echo "version_mismatch=false" >> $GITHUB_OUTPUT
          fi
          echo "Config version: $CONFIG_VERSION"
          echo "Tag version: $TAG_VERSION"

      - name: Run build-all.sh
        if: steps.compare_version.outputs.version_mismatch == 'false'
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh --build ${{ steps.get_version.outputs.version }}

      - name: Create GitHub release
        if: steps.compare_version.outputs.version_mismatch == 'false'
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: keycloak-extensions ${{ github.ref_name }}
          body: Release for keycloak extensions
       
      - name: Upload release assets (JAR files)
        if: steps.compare_version.outputs.version_mismatch == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: keycloak-extensions/builds-${{ steps.get_version.outputs.version }}/*.jar

      - name: Upload SHA256SUMS asset
        if: steps.compare_version.outputs.version_mismatch == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: keycloak-extensions/builds-${{ steps.get_version.outputs.version }}/SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain