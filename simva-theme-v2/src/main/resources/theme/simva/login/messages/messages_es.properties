# SIMVA Login Theme Messages - Spanish (Español)

# Standard authentication messages (override if custom text needed)
invalidUserMessage=Usuario o contraseña inválidos.
missingUsernameMessage=Por favor, introduzca su nombre de usuario.
missingPasswordMessage=Por favor, introduzca su contraseña.

# Validation error messages
error-invalid-value=Valor proporcionado no válido.
error-empty=Este campo no puede estar vacío.

# Scheduler and activity error messages
error-invalid-token=El token proporcionado no es válido o ha expirado.
error-invalid-scheduler=Configuración de programación no válida.
error-not-current-activity=Esta actividad no está disponible actualmente. Por favor, consulte el horario.
error-activity-cannot-be-restarted=Esta actividad ya ha sido completada y no puede reiniciarse.
error-user-not-participant=No eres participante en este estudio.
error-no-scheduler-info=No hay información de programación disponible para este estudio.
error-token-user-must-use-token-authentication=Debes usar tu token asignado para autenticarte.
error-session-not-active=La sesión aún no está activa. Por favor, espere hasta que comience la sesión.
